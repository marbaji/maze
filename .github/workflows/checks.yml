name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Key adapter tests
        run: node tests/byok.test.cjs
      - name: Rebuild matches the committed pages
        run: bash tests/rebuild-check.sh
      - name: Privacy scan
        run: python3 tests/privacy-scan.py
      - name: README line links
        run: python3 tests/readme-links-check.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.64.0-alpha-1790635538000
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Play page structure
        run: node tests/play-page-check.cjs index.html
      - name: Play page behaviour
        run: node tests/play-behaviour.cjs
      - name: Picture guide to getting a key
        run: node tests/guide-check.cjs
